name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  # ── Rust Program Tests ──────────────────────────────────────────
  program-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: magic-chess-program
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust + Solana tools
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Install Solana CLI
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH

      - name: Unit tests
        run: cargo test -p magic_chess --lib --test unit_tests

      - name: Build program (.so for LiteSVM)
        run: cargo build-sbf --tools-version v1.52 --arch v0

      - name: LiteSVM integration tests
        run: cargo test -p magic_chess -- litesvm

      - name: Payout integration tests
        run: cargo test -p magic_chess --test payout_full_flow

      - name: Mollusk CU benchmarks
        run: cargo test -p magic_chess --features integration-tests --test cu_benchmarks

  # ── Frontend Typecheck + Lint ───────────────────────────────────
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: frontend
        run: NEXT_LINT_PROMPT=skip npm run lint

  # ── SDK Typecheck ───────────────────────────────────────────────
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        working-directory: sdk
        run: npm install

      - name: Typecheck
        working-directory: sdk
        run: npx tsc --noEmit

      - name: Test
        working-directory: sdk
        run: npm test

  # ── Backend Typecheck + Tests ───────────────────────────────────
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

  # ── Docs build (deploys from dev via deploy-docs.yml) ──────────
  docs:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm run build
