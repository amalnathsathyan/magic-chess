<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0d0e10" />
    <title>Offline · ZUG Arena</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #0d0e10; color: #ece8df; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px 16px calc(24px + env(safe-area-inset-bottom)); }
      img { width: 64px; height: 64px; margin-bottom: 24px; }
      h1 { font-size: 28px; margin: 0 0 8px; letter-spacing: -0.01em; }
      p { margin: 0 0 24px; color: #9a9fa8; max-width: 32ch; line-height: 1.5; }
      button { background: #ff4f1a; color: #0d0e10; border: 0; padding: 12px 20px; font: inherit; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/zug-icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>ZUG Arena needs a connection to read the board from Solana. Your games are safe on-chain; the move clock keeps running.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
