# Cloudflare Workers configuration for Arena frontend
# Static export served via Workers static assets.
#
# Single deployment: this Worker builds from the `dev` branch.
#
# Dashboard Settings → Build:
#   Production branch: dev
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy
#   Root directory:  ./frontend/

name = "arena"
main = "_worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# Custom domains (playzug.xyz zone must be Active in this Cloudflare account,
# otherwise `wrangler deploy` fails). Cloudflare creates the DNS records and
# certificates. The workers.dev address stays on so old links reach the redirect
# until _worker.js redirects it.
workers_dev = true
routes = [
  { pattern = "playzug.xyz", custom_domain = true },
  { pattern = "arena.playzug.xyz", custom_domain = true }, # redirects to playzug.xyz
]

# Serve Next.js static export as Worker assets
[assets]
directory = "out"
binding = "ASSETS"

# Environment variables (set in Cloudflare Dashboard for secrets)
[vars]
# "true": the old workers.dev hosts 301 to playzug.xyz.
REDIRECT_LEGACY_HOST = "true"
NEXT_PUBLIC_RPC_ENDPOINT = "https://rpc.magicblock.app/devnet"
NEXT_PUBLIC_MAGICBLOCK_ROUTER = "https://devnet-router.magicblock.app/"
NEXT_PUBLIC_PROGRAM_ID = "FbXiX6xcMRPVuTc7AZkQMSbpKa1uBzQY16NFf5jhJC7h"
# Worker runtime only: NEXT_PUBLIC_* reach the bundle from frontend/.env.production
# (or Cloudflare *build* variables), not from here. Kept in sync for reference.
# Default stake token. Devnet only: the devnet ZUG play token the faucet hands
# out (created 2026-10-30 with `npm run faucet:create-token`), so new players
# can stake without SOL. SOL stays selectable. Mainnet: replace with the real
# stake token and drop the faucet.
NEXT_PUBLIC_WAGER_MINT = "AoeVGNnjuTAt92KZRhD59GbJTAwJSxpaTPmai8xmFSpK"
NEXT_PUBLIC_WAGER_SYMBOL = "ZUG"
NEXT_PUBLIC_WAGER_DECIMALS = "6"
NEXT_PUBLIC_PLATFORM_FEE_BPS = "100"
NEXT_PUBLIC_PLATFORM_FEE_WALLET = "ByBqw1sTTPjWQx6DEAvwT4srVyr4wUdf1R4V4wGoh8j6"
NEXT_PUBLIC_API_URL = "https://api.playzug.xyz"
NEXT_PUBLIC_SOLANA_SPONSOR_MODE = "backend"
NEXT_PUBLIC_SOLANA_FEE_PAYER_ADDRESS = "BuMLxTELQyTyNxroqFGHJprL1sdVMyQJ7om3MQUGToPQ"
NEXT_PUBLIC_PRIVY_APP_ID = "cmsdk4zc7003y0cjlc22j9igy"
