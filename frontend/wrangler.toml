# Cloudflare Workers Builds configuration for Magic Chess frontend
# Deploys Next.js static output as Worker assets.
#
# Dashboard Settings → Build:
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy --assets .next
#   Root directory:  ./frontend/

name = "arena"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Serve Next.js static output as assets
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Environment variables (set in Cloudflare Dashboard for secrets)
[vars]
NEXT_PUBLIC_RPC_ENDPOINT = "https://api.devnet.solana.com"
NEXT_PUBLIC_PROGRAM_ID = "FbXiX6xcMRPVuTc7AZkQMSbpKa1uBzQY16NFf5jhJC7h"
NEXT_PUBLIC_API_URL = "https://magic-chess-backend.example.com"
