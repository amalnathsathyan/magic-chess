# Cloudflare Workers Builds configuration for Magic Chess frontend
# Deploys Next.js static output as Worker assets.
#
# Dashboard Settings → Build:
#   Build command:   npm run build
#   Deploy command:  npx wrangler deploy --assets .next
#   Root directory:  ./frontend/

name = "arena"
main = ".open-next/worker.js"
compatibility_date = "2026-08-08"
compatibility_flags = ["nodejs_compat"]

# Serve Next.js static output as assets
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Environment variables (set in Cloudflare Dashboard for secrets)
[vars]
NEXT_PUBLIC_RPC_ENDPOINT = "https://rpc.magicblock.app/devnet"
NEXT_PUBLIC_MAGICBLOCK_ROUTER = "https://devnet-router.magicblock.app/"
NEXT_PUBLIC_PROGRAM_ID = "FbXiX6xcMRPVuTc7AZkQMSbpKa1uBzQY16NFf5jhJC7h"
NEXT_PUBLIC_WAGER_MINT = "So11111111111111111111111111111111111111112"
NEXT_PUBLIC_WAGER_SYMBOL = "WSOL"
NEXT_PUBLIC_WAGER_DECIMALS = "9"
NEXT_PUBLIC_PLATFORM_FEE_BPS = "100"

# NEXT_PUBLIC_PRIVY_APP_ID, NEXT_PUBLIC_PLATFORM_FEE_WALLET, and
# NEXT_PUBLIC_API_URL must be supplied as Cloudflare build variables.
