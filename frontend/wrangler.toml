# Cloudflare Pages configuration for Magic Chess frontend
# Cloudflare auto-detects Next.js framework.
# Deploy via Cloudflare Pages Git integration (auto) or CLI:
#   npx wrangler pages deploy .next
#
# IMPORTANT: In Cloudflare Pages Dashboard, set:
#   Build command: npm run build
#   Build output directory: .next
#   NO custom deploy command needed (Cloudflare auto-deploys Next.js output)

name = "magic-chess"
compatibility_date = "2025-08-07"

# Pages asset directory (standard dir is used for _routes.json generation)
pages_build_output_dir = ".next"

# Environment variables (set in Cloudflare Dashboard for secrets)
[vars]
NEXT_PUBLIC_RPC_ENDPOINT = "https://api.devnet.solana.com"
NEXT_PUBLIC_PROGRAM_ID = "FbXiX6xcMRPVuTc7AZkQMSbpKa1uBzQY16NFf5jhJC7h"
NEXT_PUBLIC_API_URL = "https://magic-chess-backend.example.com"
