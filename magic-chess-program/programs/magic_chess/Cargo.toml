[package]
name = "magic_chess"
version = "0.1.0"
description = "On-chain chess engine with wagering"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "magic_chess"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
integration-tests = [
    "dep:mollusk-svm",
    "dep:solana-program-test",
    "dep:spl-token",
    "dep:spl-associated-token-account",
    "dep:tokio",
]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
serde = { version = "1", features = ["derive"] }
magicblock-magic-program-api = { version = "0.10.1", default-features = false }
bincode = "^1.3"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }

# Integration test dependencies — gated behind the "integration-tests" feature.
mollusk-svm = { version = "0.14.0", optional = true }
solana-program-test = { version = "2.3", optional = true }
spl-token = { version = "7.0", optional = true }
spl-associated-token-account = { version = "4.0", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }

[dev-dependencies]
anchor-lang = "1.1.2"
solana-sdk = "2.3"
