[package]
name = "magic_chess"
version = "0.1.0"
description = "On-chain chess engine with wagering"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "magic_chess"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
integration-tests = [
    "dep:mollusk-svm",
    "dep:solana-account",
    "dep:solana-pubkey",
    "dep:solana-instruction",
    "dep:solana-hash",
    "dep:solana-system-program",
    "dep:solana-program-test",
    "dep:spl-token",
    "dep:spl-associated-token-account",
    "dep:tokio",
]

[dependencies]
anchor-lang = "1.1.2"
anchor-spl = "1.1.2"
serde = { version = "1", features = ["derive"] }
magicblock-magic-program-api = { version = "0.10.1", default-features = false }
bincode = "^1.3"
ephemeral-rollups-sdk = { version = "0.16.2", features = ["anchor"] }

# Integration test dependencies — gated behind the "integration-tests" feature.
mollusk-svm = { version = "0.14.0", optional = true }
solana-account = { version = "4", optional = true }
solana-pubkey = { version = "4", optional = true }
solana-instruction = { version = "3", optional = true }
solana-hash = { version = "3", optional = true }
solana-system-program = { version = "4", optional = true }
solana-program-test = { version = "2.3", optional = true }
spl-token = { version = "7.0", optional = true }
spl-associated-token-account = { version = "4.0", optional = true }
tokio = { version = "1", features = ["rt", "macros"], optional = true }

[dev-dependencies]
anchor-lang = "1.1.2"
mollusk-svm = "0.14.0"
# Separated Solana crates (match mollusk-svm v0.14.0 chain, for payout_full_flow)
solana-pubkey = "3"
solana-instruction = "3"
solana-account = "4"
solana-system-program = "4"
solana-sdk-ids = "3"
# Legacy Solana SDK (v2.x chain, for cu_benchmarks)
solana-sdk = "2.3"
# For hash computation (solana-hash v3 only re-exports Hash, not hash function)
sha2 = "0.10"

[[test]]
name = "cu_benchmarks"
path = "tests/mollusk/cu_benchmarks.rs"
required-features = ["integration-tests"]

[[test]]
name = "payout_full_flow"
path = "tests/integration/payout_full_flow.rs"
required-features = ["integration-tests"]
